<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <div class="date-section">
            <button id="prev-date-btn" class="date-nav-btn">&lt;</button>
            <h1 id="current-date-display">2026년 6월</h1> <button id="next-date-btn" class="date-nav-btn">&gt;</button>
        </div>
        
        <div id="weekly-calendar" class="weekly-calendar"></div>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요...">
            <button id="add-btn">새로운 일정 추가</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todo-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
